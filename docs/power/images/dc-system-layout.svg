<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="dsl dds">
  <title id="dsl">Single-line diagram of a typical off-grid DC system</title>
  <desc id="dds">Left to right: a PV array feeds a charge controller through a PV overcurrent protection device, then charges a battery bank. A main battery fuse sits within 7 inches of the battery terminal. From the battery bus, one branch runs up through an inverter to AC loads, and another branch runs down through a load breaker to DC loads. Each line represents a pair of conductors.</desc>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- main bus -->
    <path d="M146 230 L196 230" stroke="#8a95a6" stroke-width="3"/>
    <path d="M226 230 L276 230" stroke="#8a95a6" stroke-width="3"/>
    <path d="M406 230 L436 230" stroke="#8a95a6" stroke-width="3"/>
    <path d="M466 230 L506 230" stroke="#8a95a6" stroke-width="3"/>
    <path d="M636 230 L676 230" stroke="#8a95a6" stroke-width="3"/>

    <!-- PV array -->
    <rect x="36" y="190" width="110" height="80" stroke="#a8b2c0" stroke-width="3"/>
    <path d="M73 190 L73 270 M110 190 L110 270 M36 230 L146 230" stroke="#a8b2c0" stroke-width="1.5"/>

    <!-- PV OCPD fuse -->
    <rect x="196" y="215" width="30" height="30" stroke="#f0a33c" stroke-width="2.5"/>
    <path d="M196 230 L226 230" stroke="#f0a33c" stroke-width="2.5"/>

    <!-- charge controller -->
    <rect x="276" y="205" width="130" height="50" stroke="#a8b2c0" stroke-width="3"/>

    <!-- main battery fuse -->
    <rect x="436" y="215" width="30" height="30" stroke="#f0a33c" stroke-width="2.5"/>
    <path d="M436 230 L466 230" stroke="#f0a33c" stroke-width="2.5"/>

    <!-- battery bank -->
    <rect x="506" y="180" width="130" height="100" stroke="#a8b2c0" stroke-width="3"/>
    <rect x="516" y="200" width="34" height="60" stroke="#a8b2c0" stroke-width="1.5"/>
    <rect x="557" y="200" width="34" height="60" stroke="#a8b2c0" stroke-width="1.5"/>
    <rect x="598" y="200" width="34" height="60" stroke="#a8b2c0" stroke-width="1.5"/>

    <!-- branch A: up to inverter -->
    <path d="M676 230 L676 110 L706 110" stroke="#8a95a6" stroke-width="3"/>
    <rect x="706" y="85" width="130" height="50" stroke="#a8b2c0" stroke-width="3"/>
    <path d="M836 110 L872 110" stroke="#8a95a6" stroke-width="3"/>
    <path d="M872 110 L864 106 M872 110 L864 114" stroke="#8a95a6" stroke-width="3"/>
    <rect x="876" y="90" width="54" height="40" stroke="#a8b2c0" stroke-width="2.5"/>

    <!-- branch B: down to DC loads -->
    <path d="M676 230 L676 345 L706 345" stroke="#8a95a6" stroke-width="3"/>
    <rect x="706" y="330" width="30" height="30" stroke="#f0a33c" stroke-width="2.5"/>
    <path d="M706 345 L736 345" stroke="#f0a33c" stroke-width="2.5"/>
    <path d="M736 345 L776 345" stroke="#8a95a6" stroke-width="3"/>
    <rect x="776" y="320" width="100" height="50" stroke="#a8b2c0" stroke-width="3"/>

    <!-- junction dot -->
    <circle cx="676" cy="230" r="4" fill="#8a95a6" stroke="none"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#7f8b9c">
    <text x="91" y="292" text-anchor="middle">PV array</text>

    <text x="211" y="200" text-anchor="middle" fill="#f0a33c" font-size="12">PV OCPD</text>
    <text x="211" y="186" text-anchor="middle" font-size="11">(disconnect / fuse)</text>

    <text x="341" y="226" text-anchor="middle" font-size="12">Charge</text>
    <text x="341" y="242" text-anchor="middle" font-size="12">controller</text>

    <text x="451" y="200" text-anchor="middle" fill="#f0a33c" font-size="12">Main fuse</text>
    <text x="451" y="186" text-anchor="middle" font-size="11">within 7 in of terminal</text>

    <text x="571" y="302" text-anchor="middle">Battery bank</text>
    <text x="571" y="318" text-anchor="middle" font-size="12">(12 / 24 / 48 V)</text>

    <text x="771" y="115" text-anchor="middle" font-size="12">Inverter</text>
    <text x="903" y="107" text-anchor="middle" font-size="11">AC</text>
    <text x="903" y="121" text-anchor="middle" font-size="11">loads</text>

    <text x="721" y="318" text-anchor="middle" fill="#f0a33c" font-size="12">Load breaker</text>
    <text x="826" y="349" text-anchor="middle" font-size="12">DC loads</text>

    <text x="480" y="430" text-anchor="middle" font-size="12.5">Single-line diagram — each line is a pair of conductors (+ and −). Each fuse/breaker protects the wire on its load side.</text>
  </g>
</svg>
