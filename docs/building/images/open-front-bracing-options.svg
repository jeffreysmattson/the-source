<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="bot bod">
  <title id="bot">Three ways to brace the open front of a three-sided shed against racking</title>
  <desc id="bod">Left: an elevation of knee braces running from each post up to the beam it carries. Center: a plan view of a three-sided shed showing the rear wall and both end walls sheathed and carrying the lateral load, with the front left open and unbraced. Right: an elevation of a single diagonal brace run corner to corner between a post and the opposite beam. Not to scale.</desc>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- PANEL 1: knee braces (elevation) -->
    <path d="M40 340 L360 340" stroke="#8a95a6" stroke-width="3"/>
    <rect x="103" y="150" width="14" height="190" stroke="#8a95a6" stroke-width="2.5"/>
    <rect x="283" y="150" width="14" height="190" stroke="#8a95a6" stroke-width="2.5"/>
    <rect x="100" y="130" width="210" height="20" stroke="#8a95a6" stroke-width="2.5"/>
    <path d="M117 225 L155 150" stroke="#8a95a6" stroke-width="2.5"/>
    <path d="M283 225 L245 150" stroke="#8a95a6" stroke-width="2.5"/>
    <path d="M60 130 L200 70 L340 130" stroke="#8a95a6" stroke-width="2"/>

    <!-- PANEL 2: sheathed walls (plan view) -->
    <path d="M470 140 L750 140" stroke="#f0a33c" stroke-width="5"/>
    <path d="M470 140 L470 300" stroke="#f0a33c" stroke-width="5"/>
    <path d="M750 140 L750 300" stroke="#f0a33c" stroke-width="5"/>
    <path d="M470 300 L750 300" stroke="#a8b2c0" stroke-width="2" stroke-dasharray="8 5"/>

    <g stroke="#60a5fa" stroke-width="3">
      <path d="M560 365 L560 310"/>
      <path d="M550 320 L560 310 L570 320"/>
    </g>
    <g stroke="#f0a33c" stroke-width="3">
      <path d="M610 140 L610 108"/>
      <path d="M600 118 L610 108 L620 118"/>
      <path d="M470 220 L438 220"/>
      <path d="M449 212 L438 220 L449 228"/>
      <path d="M750 220 L782 220"/>
      <path d="M771 212 L782 220 L771 228"/>
    </g>

    <!-- PANEL 3: diagonal bracing (elevation) -->
    <path d="M840 340 L1160 340" stroke="#8a95a6" stroke-width="3"/>
    <rect x="903" y="150" width="14" height="190" stroke="#8a95a6" stroke-width="2.5"/>
    <rect x="1083" y="150" width="14" height="190" stroke="#8a95a6" stroke-width="2.5"/>
    <rect x="900" y="130" width="210" height="20" stroke="#8a95a6" stroke-width="2.5"/>
    <path d="M917 340 L1083 150" stroke="#8a95a6" stroke-width="3"/>
    <path d="M860 130 L1000 70 L1140 130" stroke="#8a95a6" stroke-width="2"/>

    <g stroke="#a8b2c0" stroke-width="1.5">
      <path d="M1000 246 L1150 252"/>
    </g>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#7f8b9c">
    <text x="200" y="40" text-anchor="middle" font-size="14">Knee braces</text>
    <text x="200" y="258" text-anchor="middle" font-size="11">Connection and truss must</text>
    <text x="200" y="272" text-anchor="middle" font-size="11">be designed for the brace load</text>
    <text x="200" y="405" text-anchor="middle" font-size="12.5">Elevation — post-to-truss knee bracing. Not to scale.</text>

    <text x="610" y="40" text-anchor="middle" font-size="14">Sheathed end and rear walls</text>
    <text x="610" y="98" text-anchor="middle" font-size="12" fill="#f0a33c">Sheathed — carries lateral load</text>
    <text x="610" y="318" text-anchor="middle" font-size="11">Open — no wall, no bracing here</text>
    <text x="560" y="382" text-anchor="middle" font-size="12">Wind</text>
    <text x="610" y="405" text-anchor="middle" font-size="12.5">Plan view — rear and end walls sheathed, front open. Not to scale.</text>

    <text x="1000" y="40" text-anchor="middle" font-size="14">Diagonal bracing</text>
    <text x="1190" y="250" text-anchor="end" font-size="11">Let-in board,</text>
    <text x="1190" y="264" text-anchor="end" font-size="11">steel rod, or cable</text>
    <text x="1000" y="405" text-anchor="middle" font-size="12.5">Elevation — corner-to-corner diagonal bracing. Not to scale.</text>
  </g>
</svg>
