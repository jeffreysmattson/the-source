    <text x="382" y="220">D = 12–16 in</text>
    <text x="382" y="236" font-size="11.5">where insulated as an FPSF</text>
    <text x="290" y="338" text-anchor="middle">Bearing width ≥ 12 in</text>
    <text x="160" y="300" text-anchor="middle">Wing insulation</text>
    <text x="160" y="316" text-anchor="middle" font-size="11.5">per code table</text>
    <text x="160" y="332" text-anchor="middle" font-size="11.5">(wider at corners)</text>
