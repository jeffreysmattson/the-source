<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d">
  <title id="t">Monolithic slab with integral turndown footing and frost-protection insulation</title>
  <desc id="d">Section through the perimeter of an Alaskan slab. The floor slab and its thickened edge footing are a single concrete placement, with reinforcement continuous through the turndown and anchor bolts set in the wet slab. Beneath the slab, from the top down, are a vapor retarder, sub-slab rigid foam, and a compacted crushed stone sub-base. Outside, vertical insulation covers the face of the turndown and horizontal wing insulation extends outward below grade, which is what makes the assembly a frost-protected shallow foundation. Finished grade falls away from the building.</desc>

