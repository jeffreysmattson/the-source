<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
  <title id="t">Eave detail: ice barrier extent, drip edge, vent channel, and the heat path that causes ice dams</title>
  <desc id="d">Section through a roof eave on a sloped roof. From the structural sheathing up, the layers are a self-adhering ice barrier running from the eave edge to a point twenty-four inches inside the exterior wall line, underlayment lapped over it up-slope, and asphalt shingles. A drip edge wraps the eave edge. Below the deck, a baffle keeps a vented air channel open from the soffit intake vent past the insulation, which is carried at full depth over the top plate. An ice dam has formed at the cold overhang, with meltwater ponded behind it backing up under the shingles. Red arrows show warm air leaking up through the ceiling plane, which is the actual cause of the melting above.</desc>

