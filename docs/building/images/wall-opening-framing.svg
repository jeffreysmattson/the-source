    <text x="130" y="32" text-anchor="middle">Double top plate</text>
    <text x="470" y="32" text-anchor="middle">Cripple studs</text>
    <text x="700" y="32" text-anchor="middle">Header</text>

    <text x="500" y="186" text-anchor="middle">Rough opening</text>
    <text x="500" y="204" text-anchor="middle" font-size="12">sized to the unit, not the finish</text>
    <text x="500" y="244" text-anchor="middle" font-size="12">Double rough sill</text>

    <text x="180" y="386" text-anchor="middle">Bottom plate</text>
    <text x="340" y="386" text-anchor="middle">Jack studs</text>
