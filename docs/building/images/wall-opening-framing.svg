    <rect x="346" y="80" width="14" height="256"/>
    <rect x="640" y="80" width="14" height="256"/>

    <rect x="360" y="148" width="14" height="188"/>
    <rect x="626" y="148" width="14" height="188"/>

    <rect x="360" y="104" width="280" height="44"/>
