<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t2 d2">
  <title id="t2">Elevation of a framed wall with a rough opening</title>
  <desc id="d2">Elevation of a stud wall showing, from the top down, a double top plate, cripple studs over the header, a built-up header spanning the opening, king studs running full height on each side of the opening, jack or trimmer studs inside the kings carrying the ends of the header, the rough opening itself, a double rough sill, cripple studs below the sill, and the bottom or sole plate. Common studs fill the wall on either side. Not to scale.</desc>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#8a95a6" stroke-width="2.5">
