<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 96 880 544" width="880" height="544" role="img" aria-labelledby="t d">
  <title id="t">Section through a platform-framed building, showing the load path and rafter thrust</title>
  <desc id="d">Transverse section through a small gable-roofed building. From the top down: roof sheathing over rafters that meet at a ridge board, a collar tie in the upper third of the rafter span, ceiling joists resting on the wall top plates and running the full width of the building so they act as rafter ties, a double top plate, stud walls, a bottom plate on a subfloor, floor joists spanning to a center girder carried on a post and footing, sill plates anchor-bolted to foundation walls, and footings below frost depth. Blue arrows trace the gravity load path from the rafter down the wall and through the foundation to the footing. Orange arrows at the top of each wall show the outward thrust the rafters exert, which the ceiling-joist tie resists. Not to scale.</desc>

