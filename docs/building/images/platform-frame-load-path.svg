  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#7f8b9c">
    <text x="164" y="206" text-anchor="end">Roof sheathing</text>
    <text x="164" y="250" text-anchor="end">Rafter</text>
