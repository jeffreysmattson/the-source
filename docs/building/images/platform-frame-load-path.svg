    <text x="716" y="344">Load path</text>
    <text x="716" y="452">Rim joist</text>
    <text x="716" y="566">Footing below</text>
    <text x="716" y="582">frost depth</text>

    <text x="440" y="336" text-anchor="middle" font-size="12">Rafters push the top of the wall outward;</text>
    <text x="440" y="352" text-anchor="middle" font-size="12">the tie across the bottom resists it</text>
    <text x="440" y="618" text-anchor="middle">Center girder, post, and footing</text>
