site_name: The Source
site_description: A general-purpose local reference wiki, usable without internet access.
docs_dir: docs
site_dir: site

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - glightbox
  - offline

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

# Local copy of the iframe-worker shim. Declaring it here stops the offline
# plugin from injecting the same script from unpkg.com, which would be an
# unreachable dependency in exactly the situation this wiki is built for.
extra:
  polyfills:
    - assets/javascripts/iframe-worker.js
